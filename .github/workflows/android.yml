name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --stacktrace
      - name: Release shrink keeps FFmpeg decoder fields
        run: |
          ./gradlew :app:minifyReleaseWithR8 --stacktrace
          dex=app/build/intermediates/dex/release/minifyReleaseWithR8/classes.dex
          strings "$dex" | grep -qx decoderPrivate
          strings "$dex" | grep -F 'Landroidx/media3/decoder/VideoDecoderOutputBuffer;'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2160player-debug
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 14
      - name: Upload library AAR
        uses: actions/upload-artifact@v4
        with:
          name: player-core
          path: player-core/build/outputs/aar/*.aar
          retention-days: 14
