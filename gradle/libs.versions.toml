[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
media3 = "1.11.1"
nextlib = "1.11.1-0.16.0"
activity = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
coroutines = "1.11.0"
libtorrent4j = "2.1.0-39"
zxing = "3.5.3"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
